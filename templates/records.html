<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Submissions</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f4f4f9;
        }

        h1 {
            margin-bottom: 10px;
        }

        a.button {
            display: inline-block;
            padding: 8px 12px;
            border-radius: 8px;
            text-decoration: none;
            background: #4CAF50;
            color: #fff;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,.1);
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #eee;
            text-align: left;
        }

        th {
            background: #fafafa;
        }

        tr:hover {
            background: #f9f9ff;
        }
    </style>
</head>
<body>
    <h1>All Applications</h1>
    <p>
        <a href="/" class="button">+ New submission</a>
    </p>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Full name</th>
                <th>Email</th>
                <th>Previous job</th>
                <th>Years</th>
                <th>Expected salary</th>
            </tr>
        </thead>
        <tbody>
            {% for r in rows %}
            <tr>
                <td>{{ r.id }}</td>
                <td>{{ r.full_name }}</td>
                <td>{{ r.email }}</td>
                <td>{{ r.previous_job }}</td>
                <td>{{ r.years }}</td>
                <td>{{ r.salary }}</td>
            </tr>
            {% else %}
            <tr><td colspan="6">No submissions yet.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
