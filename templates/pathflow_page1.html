<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Job Application Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f4f9;
        }

        h1 {
            color: #333;
        }

        form {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            width: 400px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            margin-top: 15px;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

            button:hover {
                background-color: #45a049;
            }
    </style>
</head>
<body>
    <h1>Job Application Form</h1>
    <p>Please fill out your details below:</p>

    <form action="/submit" method="post" id="appForm" novalidate>
        <label>Full Name:</label>
        <input type="text" name="full_name" required minlength="2" />

        <label>Email:</label>
        <input type="email" name="email" required />

        <label>Previous Job:</label>
        <input type="text" name="previous_job" required minlength="2" />

        <label>Years on that Job:</label>
        <input type="number" name="years" required min="0" />

        <label>Expected Salary ($):</label>
        <input type="number" name="salary" required min="0" />

        <button type="submit">Submit</button>
        <p id="err" style="color:#c0392b; font-weight:bold; display:none; margin-top:10px;"></p>
    </form>

    <script>
        const form = document.getElementById('appForm');
        const err = document.getElementById('err');
        form.addEventListener('submit', (e) => {
            if (!form.checkValidity()) {
                e.preventDefault();
                err.textContent = 'Please fill all fields correctly.';
                err.style.display = 'block';
            }
        });
    </script>

</body>
</html>
